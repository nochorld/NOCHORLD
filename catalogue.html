<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Arcana - Available Books</title>

<style>
body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background-color: #111;
    color: #fff;
    margin: 0;
    padding: 20px;
    line-height: 1.5;
    -webkit-user-select: none;
    user-select: none;
}

.catalogue-header { text-align: center; margin-bottom: 25px; }
.catalogue-title {
    font-size: 1.4rem;
    font-weight: 900;
    color: #e50914;
    text-transform: uppercase;
    letter-spacing: 2px;
}

.catalogue-slogan {
    font-size: 0.75rem;
    color: #aaa;
    letter-spacing: 3px;
    text-transform: uppercase;
}

.category-title {
    font-size: 1.1rem;
    font-weight: bold;
    margin: 25px 0 10px 10px;
    border-left: 3px solid #e50914;
    padding-left: 8px;
}

.netflix-row {
    display: flex;
    overflow-x: auto;
    gap: 15px;
    padding: 10px;
}

.book-card {
    min-width: 140px;
    background: #222;
    border-radius: 8px;
    cursor: pointer;
}

.cover-placeholder {
    height: 190px;
    background: linear-gradient(135deg,#444,#222);
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
}

.cover-badge {
    position: absolute;
    top: 8px;
    left: 8px;
    background: #e50914;
    font-size: 0.6rem;
    padding: 2px 6px;
}

.synopsis-panel {
    display: none;
    background: #181818;
    padding: 20px;
    margin: 15px 10px;
    border-radius: 8px;
}

.action-btn {
    display: block;
    padding: 12px;
    background: #e50914;
    color: #fff;
    text-align: center;
    border-radius: 4px;
    text-decoration: none;
}
</style>
</head>

<body>

<!-- HEADER -->
<div class="catalogue-header">
    <div class="catalogue-title">NOCHORLD LibraryPlus</div>
    <div class="catalogue-slogan">ENTER INTO A NEW WORLD</div>
</div>

<!-- CONTINUE BUTTON -->
<div style="text-align:center;margin-bottom:20px;">
    <button onclick="continueReading()" class="action-btn">
        Continue Reading
    </button>
</div>

<!-- ROMANCE -->
<div class="category-title">Romance & Drama</div>
<div class="netflix-row">

<div class="book-card" onclick="toggleSynopsis('arcana')">
    <div class="cover-placeholder">
        <span class="cover-badge">New</span>
        Arcana
    </div>
</div>

</div>

<!-- SYNOPSIS -->
<div id="arcana" class="synopsis-panel">
    <h3>Arcana: A Love Story</h3>
    <p>Dive into a story of emotion, conflict and mystery.</p>

    <!-- IMPORTANT: READ GATE CHECK -->
    <a href="read.html?book=arcana&type=prologue"
       class="action-btn"
       onclick="return checkAccess()">
        Open Table of Contents
    </a>
</div>

<script>

/* =========================
   1. SESSION CHECK
========================= */
function isLoggedIn() {
    return sessionStorage.getItem("user_authenticated") === "true";
}

/* =========================
   2. ACCESS GATE
   (catalogue visible, reading protected)
========================= */
function checkAccess() {
    if (!isLoggedIn()) {
        alert("Access denied. Please authenticate in portal gate.");
        return false;
    }
    return true;
}

/* =========================
   3. SYNOPSIS TOGGLE
========================= */
function toggleSynopsis(id) {
    document.querySelectorAll(".synopsis-panel")
        .forEach(p => p.style.display = "none");

    const el = document.getElementById(id);
    el.style.display = (el.style.display === "block") ? "none" : "block";
}

/* =========================
   4. CONTINUE READING
========================= */
function continueReading() {
    const last = localStorage.getItem("last_read_arcana");

    if (!last) {
        location.href = "read.html?book=arcana&type=prologue";
        return;
    }

    const data = JSON.parse(last);

    let url = `read.html?book=${data.book}&type=${data.type}`;

    if (data.num) url += `&num=${data.num}`;

    location.href = url;
}

</script>

</body>
</html>
