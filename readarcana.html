<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NOCHORLD Reader</title>

    <style>
        body {
            margin: 0;
            padding: 20px;
            background: #0b0b0f;
            color: #e2e8f0;
            font-family: system-ui, sans-serif;
        }

        .container {
            max-width: 750px;
            margin: auto;
        }

        .title {
            font-size: 20px;
            color: #6366f1;
            margin-bottom: 10px;
        }

        .section-label {
            font-size: 14px;
            opacity: 0.7;
            margin-bottom: 20px;
        }

        .content {
            font-size: 16px;
            line-height: 1.7;
            white-space: pre-wrap;
        }

        .missing {
            color: #f87171;
        }

        button {
            background: #1b1b26;
            color: #e2e8f0;
            border: 1px solid #2a2a40;
            padding: 10px 15px;
            border-radius: 8px;
            cursor: pointer;
        }

        button:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .nav {
            margin-top: 30px;
            display: flex;
            justify-content: space-between;
        }
    </style>
</head>

<body>

<div class="container">
    <div class="title" id="title">Loading...</div>
    <div class="section-label" id="label"></div>
    <div class="content" id="content"></div>
</div>

<script src="books.js"></script>

<script>

/* =========================
   BASE64 DECODER ENGINE
========================= */
function decodeContent(data) {
    if (!data) return "";

    try {
        return atob(data);
    } catch (e) {
        return "⚠ Failed to decode content.";
    }
}

/* =========================
   1. HARD ACCESS GATE
========================= */
if (sessionStorage.getItem("user_authenticated") !== "true") {
    document.body.innerHTML = `
        <div style="
            display:flex;
            height:100vh;
            align-items:center;
            justify-content:center;
            text-align:center;
            padding:20px;
            font-family:system-ui;
            color:#f87171;
            background:#0b0b0f;
        ">
            Access denied. Login required.
        </div>
    `;
    throw new Error("Not authenticated");
}

/* =========================
   2. ROUTE PARAMS
========================= */
const params = new URLSearchParams(window.location.search);

const bookId = params.get("book");
const type = params.get("type");
const chapterNum = parseInt(params.get("num"));

const titleEl = document.getElementById("title");
const labelEl = document.getElementById("label");
const contentEl = document.getElementById("content");

/* =========================
   3. ERROR HANDLER
========================= */
function error(msg) {
    titleEl.innerText = "Error";
    contentEl.innerHTML = `<span class="missing">${msg}</span>`;
}

/* =========================
   4. VALIDATE BOOK
========================= */
if (!BOOKS || !BOOKS[bookId]) {
    error("Book not found.");
    throw new Error("Invalid book");
}

const book = BOOKS[bookId];
titleEl.innerText = book.title;

/* =========================
   5. PROLOGUE
========================= */
if (type === "prologue") {

    labelEl.innerText = "Prologue";

    const data = book.sections?.prologue?.content;

    contentEl.innerText = decodeContent(data) || "{{PROLOGUE_CONTENT}}";

    localStorage.setItem("last_read_" + bookId, JSON.stringify({
        book: bookId,
        type: "prologue"
    }));
}

/* =========================
   6. CHAPTER ENGINE
========================= */
else if (type === "chapter") {

    const chapters = book.sections?.chapters || {};
    const chapter = chapters[chapterNum];

    const chapterKeys = Object.keys(chapters)
        .map(n => parseInt(n))
        .sort((a, b) => a - b);

    const maxChapter = chapterKeys.length
        ? chapterKeys[chapterKeys.length - 1]
        : 0;

    labelEl.innerText = "Chapter " + chapterNum;

    if (!chapter) {
        error("Chapter not found or not written yet.");
    } else {
        contentEl.innerText = decodeContent(chapter);

        localStorage.setItem("last_read_" + bookId, JSON.stringify({
            book: bookId,
            type: "chapter",
            num: chapterNum
        }));
    }

    /* NAVIGATION */
    const nav = document.createElement("div");
    nav.className = "nav";

    const prev = document.createElement("button");
    const next = document.createElement("button");

    prev.innerText = "⬅ Previous";
    next.innerText = "Next ➡";

    prev.onclick = () => {
        if (chapterNum > 1) {
            location.href =
                `read.html?book=${bookId}&type=chapter&num=${chapterNum - 1}`;
        }
    };

    next.onclick = () => {
        if (chapterNum < maxChapter) {
            location.href =
                `read.html?book=${bookId}&type=chapter&num=${chapterNum + 1}`;
        }
    };

    if (chapterNum <= 1) prev.disabled = true;
    if (chapterNum >= maxChapter) next.disabled = true;

    nav.appendChild(prev);
    nav.appendChild(next);

    document.querySelector(".container").appendChild(nav);
}

/* =========================
   7. EPILOGUE
========================= */
else if (type === "epilogue") {

    labelEl.innerText = "Epilogue";

    const data = book.sections?.epilogue?.content;

    contentEl.innerText = decodeContent(data) || "{{EPILOGUE_CONTENT}}";

    localStorage.setItem("last_read_" + bookId, JSON.stringify({
        book: bookId,
        type: "epilogue"
    }));
}

/* =========================
   8. INVALID MODE
========================= */
else {
    error("Invalid reading mode.");
}

</script>

</body>
</html>
